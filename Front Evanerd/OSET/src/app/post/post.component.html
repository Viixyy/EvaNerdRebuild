<mat-card appearance="outlined" *ngFor="let post of listPosts" class="mb-1">
    <mat-card-header>
        <img mat-card-avatar src="{{post.author.photo}}">
        <mat-card-title class="mt-2"> {{post.author.firstName}} {{post.author.lastName}} </mat-card-title>
        <span style="flex: 1 1 auto;"></span>
        <!-- turned_in_not -->
        <mat-icon class="mt-2" [fontIcon]="post.pinned ? 'turned_in' : 'turned_in_not'"></mat-icon>
    </mat-card-header>
    <mat-card-content class="mb-3">
        <p> {{post.content}} </p>
    </mat-card-content>
    <div class="d-flex align-items-center justify-content-center mx-2">
        <img style="border-radius: 6%" class="img-fluid d-block" [src]="post.banner" alt="">
    </div>
    <mat-card-actions>
        <button mat-button><mat-icon class="ms-2" fontIcon="chat_bubble_outline"></mat-icon></button>
        <button mat-button><mat-icon class="ms-2" fontIcon="insert_emoticon"></mat-icon></button>
        <!-- favorite_border -->
        <p class="mt-3">{{post.liked}}</p>
        <button mat-button><mat-icon class="ms-2" fontIcon="favorite"></mat-icon></button>
    </mat-card-actions>
</mat-card>
